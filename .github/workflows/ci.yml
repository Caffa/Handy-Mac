# Unified CI — runs on every push to main and on pull requests.
# Catches lint errors, formatting issues, and test failures before merge.
#
# This complements the existing specialized workflows:
#   - code-quality.yml  → frontend lint (ESLint + Prettier + translations)
#   - test.yml          → Rust unit tests
#   - build.yml         → cross-platform builds
#   - nix-check.yml     → Nix flake evaluation
#
# This workflow adds Biome linting and Rust clippy/rustfmt checks that
# weren't covered before.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: ESLint (i18next rule)
        run: bun run lint

      - name: Biome check
        run: bun run lint:biome

      - name: TypeScript & Vite build
        run: bun run build

  rust:
    name: Rust lint & test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev libssl-dev pkg-config cmake libgtk-layer-shell-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Use mock TranscriptionManager (CI only)
        working-directory: src-tauri
        run: |
          cp src/managers/transcription_mock.rs src/managers/transcription.rs
          sed -i '/^transcribe-rs/d' Cargo.toml

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt -- --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        working-directory: src-tauri
        run: cargo test

  tsan:
    name: ThreadSanitizer (best-effort)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev libssl-dev pkg-config cmake libgtk-layer-shell-dev

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Use mock TranscriptionManager (CI only)
        working-directory: src-tauri
        run: |
          cp src/managers/transcription_mock.rs src/managers/transcription.rs
          sed -i '/^transcribe-rs/d' Cargo.toml

      - name: Run TSan concurrency test
        working-directory: src-tauri
        env:
          RUSTFLAGS: "-Zsanitizer=thread"
        run: cargo +nightly test --features tsan --test tsan_concurrency -- --test-threads=1